<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F1EBE4">
<title>Blindervenner · Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  --bg:#0A0118; --bg-2:#120726; --surface:#180C33; --surface-2:#22103F;
  --border:rgba(0,240,255,0.22); --border-strong:rgba(0,240,255,0.45);
  --text:#F2ECFF; --text-dim:#B2A3E0; --text-faint:#8374B3;
  --accent:#FF2E97; --accent-2:#00F0FF;
  --good:#00FF9C; --good-soft:rgba(0,255,156,0.12);
  --bad:#FF3B5C; --bad-soft:rgba(255,59,92,0.14);
  --mid:#FFD500; --mid-soft:rgba(255,213,0,0.14);
  --grid:rgba(178,163,224,0.13);
  --radius:4px; --radius-sm:3px;
  --p1:#00F0FF; --p2:#FF2E97; --p3:#FFD500;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    linear-gradient(rgba(0,240,255,0.05) 1px,transparent 1px) 0 0/100% 3px,
    radial-gradient(1000px 550px at 50% 110%,rgba(255,46,151,0.20),transparent 60%),
    radial-gradient(800px 500px at 50% -10%,rgba(0,240,255,0.14),transparent 55%),
    linear-gradient(180deg,#17022E 0%,#0A0118 45%,#05000C 100%);
  background-attachment:fixed;
  background-color:#0A0118;
  color:var(--text); font-family:'VT323',monospace; font-size:19px;
  -webkit-font-smoothing:antialiased;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:100;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.18) 0px,rgba(0,0,0,0.18) 1px,transparent 1px,transparent 3px);mix-blend-mode:overlay}
body::after{content:'';position:fixed;left:0;right:0;bottom:0;height:42vh;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,46,151,0.55) 1px,transparent 1px),linear-gradient(90deg,rgba(255,46,151,0.55) 1px,transparent 1px);
  background-size:48px 48px;transform:perspective(260px) rotateX(62deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(0deg,black 15%,transparent 85%);mask-image:linear-gradient(0deg,black 15%,transparent 85%);opacity:0.4}

.app{max-width:1240px;margin:0 auto;position:relative;z-index:1;padding:0 16px 60px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 14px;position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,#0A0118 78%,rgba(10,1,24,0));border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:24px;height:24px;flex:0 0 auto;filter:drop-shadow(0 0 6px var(--accent-2))}
.brand-name{font-family:'Press Start 2P',monospace;font-size:clamp(0.58rem,2.6vw,0.85rem);color:var(--accent-2);white-space:nowrap;
  text-shadow:0 0 8px rgba(0,240,255,0.65),0 0 18px rgba(0,240,255,0.3)}
.brand-sub{font-family:'Press Start 2P',monospace;font-size:0.55rem;color:var(--accent);margin-left:4px;text-shadow:0 0 8px rgba(255,46,151,0.6)}
.top-actions{display:flex;gap:8px;align-items:center}
.updated{font-size:0.9rem;color:var(--text-faint);white-space:nowrap}
.icon-btn{width:36px;height:36px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;background:var(--surface);
  border:1px solid var(--border);color:var(--text-dim);cursor:pointer;transition:all .15s ease;text-decoration:none;flex:0 0 auto}
.icon-btn:hover{color:var(--accent-2);border-color:var(--border-strong);box-shadow:0 0 10px rgba(0,240,255,0.25)}
.icon-btn.spin svg{animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:16px 0 6px}
.fgroup{display:flex;flex-direction:column;gap:5px}
.flabel{font-family:'Press Start 2P',monospace;font-size:0.5rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em}
.seg{display:flex;border:2px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden}
.seg button{background:var(--bg-2);color:var(--text-dim);border:none;padding:7px 13px;font-family:'VT323',monospace;font-size:1.05rem;cursor:pointer}
.seg button+button{border-left:1px solid var(--border)}
.seg button:hover{color:var(--accent-2)}
.seg button.on{background:var(--accent);color:#0A0118}
select.sel{padding:7px 32px 7px 11px;border-radius:var(--radius-sm);border:2px solid var(--border-strong);background:#05000F;color:var(--accent-2);
  font-family:'VT323',monospace;font-size:1.05rem;appearance:none;-webkit-appearance:none;cursor:pointer;max-width:220px;
  background-image:linear-gradient(45deg,transparent 50%,var(--accent-2) 50%),linear-gradient(135deg,var(--accent-2) 50%,transparent 50%);
  background-position:calc(100% - 16px) center,calc(100% - 11px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.reset{background:none;border:none;color:var(--accent);font-family:'VT323',monospace;font-size:1.05rem;cursor:pointer;text-decoration:underline;padding:8px 2px}
.scope-note{font-size:0.95rem;color:var(--text-faint);padding:4px 0 10px}
.scope-note b{color:var(--mid);font-weight:400}
button:focus-visible,select:focus-visible,input:focus-visible,.clickable:focus-visible,a:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}

/* sections & cards */
.section{margin-top:26px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.sec-num{font-family:'Press Start 2P',monospace;font-size:0.6rem;color:var(--accent)}
h2{font-family:'Press Start 2P',monospace;font-size:0.95rem;font-weight:400;margin:0;line-height:1.5;color:var(--text);text-shadow:2px 2px 0 rgba(255,46,151,0.35)}
.sec-sub{color:var(--text-dim);font-size:1.02rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-kpi{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1000px){.g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--border);border-radius:var(--radius);padding:18px;position:relative;min-width:0;
  box-shadow:0 0 0 1px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.03)}
.card::before{content:'';position:absolute;top:-1px;left:-1px;right:-1px;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:2px 2px 0 0}
.card-title{font-family:'Press Start 2P',monospace;font-size:0.58rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--accent-2);margin-bottom:12px;
  text-shadow:0 0 6px rgba(0,240,255,0.5);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card-note{font-size:0.92rem;color:var(--text-faint);margin-top:8px;line-height:1.35}
.kpi{padding:16px 14px}
.kpi .n{font-family:'Press Start 2P',monospace;font-size:clamp(1rem,2.2vw,1.35rem);color:var(--text);margin-top:6px;line-height:1.3}
.kpi .l{font-size:0.95rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em}
.kpi .s{font-size:0.9rem;color:var(--text-faint);margin-top:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:1px}
.pname{white-space:nowrap}

/* standings */
.stand{display:grid;grid-template-columns:minmax(140px,1.3fr) repeat(var(--np),minmax(0,1fr));gap:0}
.stand .h{font-family:'Press Start 2P',monospace;font-size:0.62rem;padding:10px 8px 12px;border-bottom:2px solid var(--border-strong);text-align:right}
.stand .h:first-child{text-align:left}
.stand .c{padding:12px 8px;border-bottom:1px dashed var(--border);text-align:right;font-size:1.15rem;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;min-width:0}
.stand .c.lbl{text-align:left;align-items:flex-start;color:var(--text-dim);text-transform:uppercase;font-size:1rem;letter-spacing:0.03em}
.stand .big{font-family:'Press Start 2P',monospace;font-size:clamp(0.75rem,1.7vw,1rem);color:var(--text)}
.stand .lead .big{color:var(--good);text-shadow:0 0 8px rgba(0,255,156,0.45)}
.stand .small{font-size:0.9rem;color:var(--text-faint);text-align:right;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bar-mini{height:6px;background:var(--grid);border-radius:3px;width:100%;max-width:160px;margin-top:6px;overflow:hidden}
.bar-mini i{display:block;height:100%;border-radius:3px}

/* charts */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.axis text,.lbl-t{fill:var(--text-faint);font-family:'VT323',monospace;font-size:15px}
.val-t{fill:var(--text);font-family:'VT323',monospace;font-size:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:1rem;color:var(--text-dim)}
.legend .k{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:5px}
.legend .kb{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.hit{cursor:pointer}
.hbar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(56px,auto);gap:10px;align-items:center;padding:5px 0;border-radius:3px}
.hbar-row.clickable{cursor:pointer}
.hbar-row.clickable:hover{background:rgba(0,240,255,0.06)}
.hbar-row .nm{font-size:1.05rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-row .tr{height:14px;position:relative}
.hbar-row .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:2px}
.hbar-row .v{white-space:nowrap;text-align:right;font-size:1.05rem;color:var(--text-dim)}
.hbar-row.sel .nm{color:var(--mid)}
.pairbars{display:flex;flex-direction:column;gap:3px}
.pairbars i{position:relative!important;display:block;height:7px}

/* toggles inside cards */
.mini-seg{display:flex;border:1px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden}
.mini-seg button{background:transparent;color:var(--text-dim);border:none;padding:3px 9px;font-family:'VT323',monospace;font-size:0.98rem;cursor:pointer;letter-spacing:0;text-transform:none}
.mini-seg button.on{background:var(--accent-2);color:#0A0118}

/* top 10 & tables */
.top10{list-style:none;margin:0;padding:0}
.top10 li{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:11px 8px;border-bottom:1px dashed var(--border);cursor:pointer;border-radius:3px}
.top10 li:hover{background:rgba(0,240,255,0.06)}
.top10 .rk{font-family:'Press Start 2P',monospace;font-size:0.8rem;color:var(--accent);text-align:center}
.top10 .rk.gold{color:var(--mid);text-shadow:0 0 8px rgba(255,213,0,0.6)}
.top10 .nm{font-size:1.15rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top10 .sub{font-size:0.92rem;color:var(--text-faint)}
.top10 .sc{font-family:'Press Start 2P',monospace;font-size:0.8rem;color:var(--accent-2);text-shadow:0 0 6px rgba(0,240,255,0.5);white-space:nowrap}
.top10 .sc small{font-size:0.55rem;color:var(--text-faint);text-shadow:none}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:1.05rem}
.tbl th{font-family:'Press Start 2P',monospace;font-size:0.5rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-faint);text-align:left;padding:10px 8px;border-bottom:2px solid var(--border-strong);white-space:nowrap;font-weight:400}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--accent-2)}
.tbl th.sorted{color:var(--accent-2)}
.tbl td{padding:9px 8px;border-bottom:1px dashed var(--border);vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:rgba(0,240,255,0.06)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .dim{color:var(--text-faint)}
.search{width:100%;max-width:320px;padding:8px 12px;border-radius:var(--radius-sm);border:2px solid var(--border-strong);background:#05000F;color:var(--accent-2);font-family:'VT323',monospace;font-size:1.1rem}
.search::placeholder{color:var(--text-faint)}
.pill{display:inline-block;padding:1px 7px;border-radius:3px;font-size:0.95rem;border:1px solid}
.pill.good{color:var(--good);border-color:rgba(0,255,156,0.5);background:var(--good-soft)}
.pill.bad{color:var(--bad);border-color:rgba(255,59,92,0.5);background:var(--bad-soft)}
.pill.mid{color:var(--mid);border-color:rgba(255,213,0,0.5);background:var(--mid-soft)}
.pill.na{color:var(--text-faint);border-color:var(--border)}

/* records */
.rec{display:flex;flex-direction:column;gap:4px}
.rec .big{font-family:'Press Start 2P',monospace;font-size:0.95rem;color:var(--mid);line-height:1.4;text-shadow:0 0 8px rgba(255,213,0,0.35)}
.rec .t{font-size:1.05rem;color:var(--text)}
.rec .s{font-size:0.92rem;color:var(--text-faint)}
.linkish{color:var(--accent-2);cursor:pointer;text-decoration:underline;text-decoration-color:rgba(0,240,255,0.4)}

/* confusion list */
.conf{display:grid;grid-template-columns:1fr 24px 1fr 40px;gap:6px 8px;align-items:center;font-size:1.05rem}
.conf .arrow{color:var(--accent);text-align:center}
.conf .x{text-align:right;color:var(--text-dim)}
.conf .g{color:var(--bad)}

/* tooltip */
#tip{position:fixed;z-index:200;pointer-events:none;background:#0D0320;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:8px 11px;
  box-shadow:0 0 16px rgba(0,240,255,0.25);font-size:1rem;color:var(--text-dim);opacity:0;transition:opacity .1s;max-width:280px}
#tip.show{opacity:1}
#tip .tt{color:var(--text-faint);font-size:0.92rem;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.03em}
#tip .tr{display:flex;align-items:center;gap:8px;white-space:nowrap}
#tip .tr b{color:var(--text);font-weight:400;font-size:1.1rem}
#tip .k{display:inline-block;width:12px;height:3px;border-radius:2px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,0,12,0.78);z-index:150;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{width:100%;max-width:620px;animation:fadeIn .2s ease}
.modal .close{position:absolute;right:12px;top:12px}
.modal h3{font-family:'Press Start 2P',monospace;font-size:0.8rem;line-height:1.6;margin:0 40px 6px 0;color:var(--text);font-weight:400}
.cmp{display:grid;grid-template-columns:minmax(90px,1fr) 1fr 1fr 56px;gap:0;margin-top:14px}
.cmp>div{padding:9px 6px;border-bottom:1px dashed var(--border);font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.cmp .hd{font-family:'Press Start 2P',monospace;font-size:0.48rem;color:var(--text-faint);text-transform:uppercase;border-bottom:2px solid var(--border-strong)}
.cmp .cat{color:var(--text-dim);text-transform:uppercase;font-size:0.95rem}
.cmp .pt{text-align:right}
.score-big{font-family:'Press Start 2P',monospace;font-size:1.6rem;color:var(--accent-2);text-shadow:0 0 12px rgba(0,240,255,0.6);margin:10px 0 2px}
.score-big small{font-size:0.7rem;color:var(--text-faint);text-shadow:none}

/* state screens */
.state{text-align:center;padding:80px 20px;color:var(--text-dim);font-size:1.2rem}
.state .hero{width:72px;height:72px;margin:0 auto 22px;border:2px solid var(--accent-2);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;
  background:var(--surface);box-shadow:0 0 24px rgba(0,240,255,0.35);animation:pulseGlow 1.7s ease-in-out infinite}
.state .hero svg{width:34px;height:34px;filter:drop-shadow(0 0 6px var(--accent))}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 24px rgba(0,240,255,0.35)}50%{box-shadow:0 0 42px rgba(0,240,255,0.6)}}
.btn{font-family:'Press Start 2P',monospace;font-size:0.65rem;text-transform:uppercase;padding:13px 18px;border-radius:var(--radius);cursor:pointer;
  background:var(--accent);color:#0A0118;border:2px solid var(--bg);box-shadow:3px 3px 0 var(--accent-2),0 0 20px rgba(255,46,151,0.4);margin-top:18px}
.btn:hover{transform:translate(-1px,-1px)}
.empty{color:var(--text-faint);font-size:1.05rem;padding:14px 0}
.fade-in{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.loading-dim{opacity:0.5;transition:opacity .2s}
@media (prefers-reduced-motion:reduce){.fade-in,.modal,.state .hero{animation:none}.icon-btn.spin svg{animation:none}}
@media(max-width:560px){
  body{font-size:18px}
  .updated{display:none}
  .stand{grid-template-columns:minmax(100px,1.1fr) repeat(var(--np),minmax(0,1fr))}
  .cmp{grid-template-columns:78px 1fr 1fr 44px}
  .hbar-row{grid-template-columns:minmax(80px,110px) 1fr minmax(48px,auto)}
}

.g-kpi5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1000px){.g-kpi5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.g-kpi5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi .s .linkish{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-row .tr .tick{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:#2B1A0E}
.geo-detail{margin:2px 0 10px;padding:10px 12px;border-radius:12px;background:var(--bg-2);border:1.5px solid var(--border-strong)}
.geo-detail .hbar-row{padding:3px 0}
.geo-detail .show-only{margin-top:6px;background:none;border:none;padding:0;font-family:var(--fb);font-size:15px;color:var(--accent);text-decoration:underline;cursor:pointer}
.hbar-row .caret{display:inline-block;margin-left:6px;color:var(--text-faint);font-size:0.8em;transition:transform .15s}
.hbar-row.open .caret{transform:rotate(90deg)}
.stand-note{font-size:0.95rem;color:var(--text-faint);margin-top:10px}
</style>

<style id="blindervenner-sten">/* Blindervenner · Sten (Archivo) */
body{font-family:var(--fb);font-size:17px;background:var(--page);background-attachment:fixed;color:var(--text);-webkit-font-smoothing:antialiased}
body::before,body::after{display:none!important}
body *{text-shadow:none!important}
[style*="drop-shadow"]{filter:none!important}
.brand svg,.hero-icon svg,.state .hero svg,.ring-wrap{filter:none}
.topbar{background:var(--topbar);border-bottom:var(--rule);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.brand-name{font-family:var(--fd);font-weight:var(--fdw);color:var(--text);font-size:var(--brand-size);letter-spacing:var(--brand-ls);text-transform:var(--brand-tt);line-height:1}
.brand-sub{font-family:var(--fm);font-size:11px;color:var(--accent);letter-spacing:.12em;margin-left:8px;vertical-align:middle}
h2{font-family:var(--fd);font-weight:var(--fdw);font-size:var(--h2);line-height:1.05;letter-spacing:var(--h2-ls);text-transform:var(--h-tt);color:var(--text)}
.sub,.sec-sub{font-family:var(--fb);font-size:16px;color:var(--text-dim)}
.card{background:var(--surface);border:var(--card-border);border-radius:var(--r);box-shadow:var(--card-shadow)}
.card::before{display:none}
.card-flat,.stat-box,.review-row,.chip-edit{background:var(--bg-2);border:var(--line);border-radius:var(--r-sm)}
.eyebrow,.card-title,.flabel,.compare-lbl,.tbl th,.cmp .hd,.stat-lbl,.kpi .l,.stand .h,.sec-num,#tip .tt{font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim)}
.card-title,.eyebrow{color:var(--text)}
.stat-num,.kpi .n,.stand .big,.lb-score,.hist-item .score,.top10 .sc,.score-big,.rec .big,.live-score .n,.top10 .rk,.lb-rank{font-family:var(--fnum);font-weight:var(--fnumw);color:var(--text);letter-spacing:-0.01em;line-height:1}
.kpi .n{font-size:40px;margin-top:10px}.stat-num{font-size:34px}.stand .big{font-size:30px}.score-big{font-size:72px;color:var(--accent)}
.rec .big{font-size:32px;color:var(--accent)}.top10 .sc{font-size:26px;color:var(--accent)}.top10 .sc small{font-family:var(--fm);font-size:11px}
.lb-score,.hist-item .score{font-size:22px;color:var(--accent)}.live-score .n{font-size:28px;color:var(--accent)}.top10 .rk,.lb-rank{font-size:20px;color:var(--text-faint)}
.top10 .rk.gold{color:var(--mid)}.stand .lead .big{color:var(--good)}
.btn{font-family:var(--fb);font-weight:700;font-size:15px;letter-spacing:var(--btn-ls);text-transform:var(--btn-tt);border-radius:var(--r-btn);padding:15px 22px}
.btn-sm{font-size:13px;padding:10px 16px}
.btn-primary,.state .btn{background:var(--accent);color:var(--on-accent);border:var(--btn-border);box-shadow:var(--btn-shadow)}
.btn-primary:hover,.btn:hover{transform:translateY(-1px);box-shadow:var(--btn-shadow)}
.btn-primary:active{transform:translateY(2px);box-shadow:none}
.btn-secondary{background:var(--surface);color:var(--text);border:var(--line-strong)}
.btn-secondary:hover{box-shadow:none;border-color:var(--text)}
.btn-ghost,.reset{font-family:var(--fb);color:var(--text-dim)}
.icon-btn{background:var(--surface);border:var(--line);border-radius:var(--r-btn);color:var(--text)}
.icon-btn:hover{box-shadow:none;color:var(--accent);border-color:var(--accent)}
.icon-btn.active{background:var(--text);color:var(--surface);border-color:var(--text);box-shadow:none}
.chip-pick{background:var(--surface);border:var(--line-strong);border-radius:var(--r-btn);color:var(--text);font-family:var(--fb);font-size:16px}
.chip-pick:hover{border-color:var(--accent);color:var(--accent)}
.chip-pick.selected{background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:var(--chip-shadow,none);font-weight:700}

.chip-edit input{border:none;background:transparent}
input[type=text]:focus,select.year-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field-label .txt{font-family:var(--fb);font-weight:600;text-transform:none;letter-spacing:0;font-size:15px}
.field-label .pts,.review-pts{font-family:var(--fm);font-size:11px;font-weight:600}
.field-label .pts{background:var(--text);color:var(--surface);border-radius:var(--r-sm)}
.seg,.mini-seg{border:var(--line-strong);border-radius:var(--r-btn)}
.seg button,.mini-seg button{font-family:var(--fb);background:var(--surface);color:var(--text-dim);font-size:15px}
.seg button.on{background:var(--accent);color:var(--on-accent)}.mini-seg button.on{background:var(--text);color:var(--surface)}
.jbtn{font-family:var(--fb);background:var(--surface);border:var(--line-strong);border-radius:var(--r-sm);text-transform:none;font-weight:600;letter-spacing:0}
.jbtn.good.on,.jbtn.bad.on,.jbtn.mid.on{box-shadow:none}
.live-score{background:var(--surface);border:var(--line-accent);box-shadow:var(--card-shadow);border-radius:var(--r)}
.live-score span:first-child,.review-title,.hist-item .name,.stand .c.lbl,.kpi .l,.rules-toggle,.stat-lbl{text-transform:none;letter-spacing:0;font-family:var(--fb);font-weight:600}
.phase-dot{background:var(--border-strong);border-radius:99px}.phase-dot.on{background:var(--accent);box-shadow:none}
.hero-icon,.state .hero{background:var(--surface);border:var(--line-strong);box-shadow:var(--card-shadow);border-radius:var(--r);animation:none}
.hero-icon.pulse,.state .hero{animation:skinPulse 1.8s ease-in-out infinite}
@keyframes skinPulse{50%{transform:scale(1.06)}}
.toast{background:var(--text);color:var(--surface);border:none;box-shadow:var(--card-shadow);font-family:var(--fb);text-transform:none;letter-spacing:0;border-radius:var(--r-btn)}
.lb-row,.stand .c,.top10 li,.tbl td,.cmp>div{border-bottom:1px solid var(--border)}
.stand .h,.tbl th,.cmp .hd{border-bottom:var(--line-strong)}
.identity-pill{border-radius:var(--r-btn);border:var(--line-strong)}
#tip{background:var(--surface);border:var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);font-family:var(--fb);border-radius:var(--r-sm)}
.modal-bg{background:var(--scrim)}
.modal h3{font-family:var(--fd);font-weight:var(--fdw);font-size:34px;line-height:1.05;text-transform:var(--h-tt)}
.linkish{color:var(--accent);text-decoration-color:currentColor}
.axis text,.lbl-t{font-family:var(--fm);font-size:12px;fill:var(--text-faint)}.val-t{font-family:var(--fm);font-size:13px}
.hbar-row .nm,.top10 .nm,.tbl,.conf,.legend,.card-note,.hint,.rules-panel{font-family:var(--fb)}
.top10 .nm{font-weight:600}
.pill{border-radius:var(--r-sm);font-family:var(--fb);font-size:14px}

<script>
/* ============================================================
   KONFIGURATION
   Data hentes direkte fra regnearket "Blindervenner" (fanen Vine)
   via Apps Script-webappen – samme kald som appen bruger ("sync").
   Kaldet læser kun; det ændrer intet i arket.
   ============================================================ */
const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbyla01AQW2iYGt4-uJ7kI4QTu1mkJDnVvpElWs4Lof2MdstBK-nE4RuCeB2o00xzMPe-g/exec';
const DEFAULT_KEY = '5144ab14747841ad8e946ae2';

const CATS = [
  {id:'land',        label:'Land',          short:'Land',   max:2},
  {id:'region',      label:'Region',        short:'Region', max:3},
  {id:'appellation', label:'Appellation',   short:'Appel.', max:5},
  {id:'drue1',       label:'Dom. drue',     short:'Drue',   max:8},
  {id:'drue2',       label:'Ekstra drue',   short:'Drue 2', max:2},
  {id:'type',        label:'Type/kvalitet', short:'Type',   max:2},
  {id:'aargang',     label:'Årgang',        short:'Årgang', max:2},
];
const MAX = 24;
const PLAYER_COLORS = { 'lars':'#4F6563', 'tore':'#CA9954' };
const FALLBACK_COLORS = ['#4F6563','#CA9954','#8E6628','#3E6B57'];
const MONTHS = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];

/* ============================================================ state */
let ALL = [];            // alle vine (normaliseret)
let PLAYERS = [];        // navne på gættere
let F = { player:'all', period:'all', land:'all', drue:'all' };
let UI = { trend:'evening', geo:'land', geoOpen:null, archiveSort:{key:'date',dir:-1}, archiveQ:'' };
let LOADED_AT = null;

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s ?? '').trim().toLowerCase(); }
function fmt1(n){ return (Math.round(n*10)/10).toLocaleString('da-DK',{minimumFractionDigits:1,maximumFractionDigits:1}); }
function pct(n){ return Math.round(n*100) + '%'; }
function avg(a){ return a.length ? a.reduce((s,x)=>s+x,0)/a.length : 0; }
function colorOf(name){
  const k = norm(name);
  if(PLAYER_COLORS[k]) return PLAYER_COLORS[k];
  const i = PLAYERS.indexOf(name);
  return FALLBACK_COLORS[(i<0?0:i) % FALLBACK_COLORS.length];
}
function fmtDate(iso, withYear=true){
  if(!iso) return '–';
  const [y,m,d] = iso.split('-');
  return `${parseInt(d,10)}. ${MONTHS[parseInt(m,10)-1]}` + (withYear ? ` ${y}` : '');
}
function pnameHTML(n){ return `<span class="pname"><span class="dot" style="background:${colorOf(n)}"></span>${esc(n)}</span>`; }

/* ============================================================ data */
function cfg(){
  // Genbrug appens forbindelse, hvis den findes i samme browser – ellers standarden ovenfor.
  try{ const c = JSON.parse(localStorage.getItem('vino_backend')||'null'); if(c && c.url && c.key) return c; }catch(e){}
  return { url: DEFAULT_URL, key: DEFAULT_KEY };
}

async function fetchWines(){
  const c = cfg();
  const res = await fetch(c.url, { method:'POST', redirect:'follow',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ k:c.key, op:'sync', paths:[], hist:'' }) });
  let j;
  try{ j = await res.json(); }catch(e){ throw new Error('Svaret fra regnearket kunne ikke læses.'); }
  if(!j.ok) throw new Error(j.err === 'denied' ? 'Nøglen blev afvist af regnearket.' : ('Fejl fra regnearket: ' + (j.err||'ukendt')));
  return j.history || [];
}

function parseDate(s){
  s = String(s||'').trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = /^(\d{1,2})[-./](\d{1,2})[-./](\d{4})/.exec(s);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}

function normalize(list){
  // Arket sender nyeste først; rækkefølgen i arket bruges som tiebreak.
  const n = list.length;
  return list.map((r,i)=>{
    const truth = r.truth||{}, guess = r.guess||{}, judged = r.judged||{};
    const cats = {};
    let score = 0, possible = 0;
    CATS.forEach(c=>{
      const t = String(truth[c.id]??'').trim(), g = String(guess[c.id]??'').trim();
      const j = judged[c.id];
      const applicable = t !== '';
      const pts = !applicable ? 0 : (j==='good' ? c.max : j==='mid' ? 1 : 0);
      cats[c.id] = { t, g, applicable, pts, j: !applicable ? 'na' : (j||'bad') };
      if(applicable){ score += pts; possible += c.max; }
    });
    const date = parseDate(r.date) || (r.createdAt ? new Date(r.createdAt).toISOString().slice(0,10) : '');
    return {
      id: r.id || ('w'+i), date,
      owner: String(r.ownerName||'').trim(), guesser: String(r.guesserName||'').trim(),
      nr: r.ownerIndex || '', name: String(r.wineNote||'').trim() || 'Unavngiven vin',
      cats, score: (typeof r.score === 'number' && !isNaN(r.score)) ? r.score : score, possible,
      createdAt: r.createdAt || 0, seq: n - i,
    };
  }).filter(w => w.guesser && w.date)
    .sort((a,b)=> a.date.localeCompare(b.date) || (a.createdAt - b.createdAt) || (a.seq - b.seq));
}

/* ============================================================ stavning
   Samme land/drue stavet lidt forskelligt (fx "Frankeig", "France", "Rhone")
   samles under én stavemåde, så de ikke får hver sin række. Pointene i arket
   ændres ikke – det er kun visningen og grupperingen. */
function fold(s){ return String(s ?? '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' '); }
function lev(a, b){
  if(a === b) return 0;
  const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1}, (_,j)=>j);
  for(let i=1;i<=m;i++){ const cur = [i]; for(let j=1;j<=n;j++){ cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1)); } prev = cur; }
  return prev[n];
}
const COUNTRIES = {
  'Frankrig':['france','frankrike'], 'Italien':['italy','italia'], 'Spanien':['spain','espana'], 'Portugal':[],
  'Tyskland':['germany','deutschland'], 'Østrig':['austria','osterreich','oestrig','osterrig'], 'Schweiz':['switzerland','suisse'],
  'Ungarn':['hungary'], 'Grækenland':['greece'], 'Slovenien':['slovenia'], 'Kroatien':['croatia'], 'Georgien':['georgia'],
  'Libanon':['lebanon'], 'Israel':[], 'Tyrkiet':['turkey'], 'Cypern':['cyprus'], 'Armenien':['armenia'], 'Moldova':[],
  'Rumænien':['romania'], 'Bulgarien':['bulgaria'], 'Serbien':['serbia'], 'Tjekkiet':['czechia','czech republic'], 'Slovakiet':['slovakia'],
  'Luxembourg':[], 'England':['uk','storbritannien','great britain'], 'Danmark':['denmark'], 'Sverige':['sweden'],
  'USA':['united states','us','amerika','u.s.a.'], 'Canada':[], 'Mexico':[], 'Chile':[], 'Argentina':[], 'Uruguay':[],
  'Brasilien':['brazil'], 'Australien':['australia'], 'New Zealand':['newzealand','nz','ny zealand'], 'Sydafrika':['south africa'],
  'Kina':['china'], 'Japan':[], 'Marokko':['morocco'], 'Ukraine':[],
};
const COUNTRY_IDX = (()=>{ const m = new Map(); Object.entries(COUNTRIES).forEach(([d,al])=>{ m.set(fold(d), d); al.forEach(a=>m.set(fold(a), d)); }); return m; })();
function capFirst(s){ s = String(s||'').trim(); return s ? s[0].toUpperCase() + s.slice(1) : s; }
function canonCountry(raw){
  const f = fold(raw); if(!f) return '';
  if(COUNTRY_IDX.has(f)) return COUNTRY_IDX.get(f);
  const lim = f.length >= 6 ? 2 : (f.length >= 4 ? 1 : 0);
  let best = null, bd = 99;
  COUNTRY_IDX.forEach((d,k)=>{ const x = lev(f,k); if(x < bd){ bd = x; best = d; } });
  return bd <= lim ? best : capFirst(raw);
}
// Ord, der kun afviger med et par bogstaver fra en hyppigere stavemåde, lægges sammen med den.
function buildVocab(values){
  const cnt = new Map(), disp = new Map();
  values.forEach(v=>{ v = String(v ?? '').trim(); if(!v) return; const f = fold(v);
    cnt.set(f, (cnt.get(f)||0)+1); const d = disp.get(f) || new Map(); d.set(v, (d.get(v)||0)+1); disp.set(f, d); });
  const keys = [...cnt.keys()].sort((a,b)=> cnt.get(b)-cnt.get(a) || a.localeCompare(b));
  const canonKeys = [], map = new Map();
  keys.forEach(k=>{ const lim = k.length >= 8 ? 2 : (k.length >= 5 ? 1 : 0);
    const hit = lim ? canonKeys.find(c=>lev(k,c) <= lim) : null;
    if(!hit) canonKeys.push(k); map.set(k, hit || k); });
  const display = f => [...disp.get(f).entries()].sort((a,b)=>b[1]-a[1])[0][0];
  return raw => { const f = fold(raw); if(!f) return ''; const t = map.get(f); return t ? display(t) : String(raw).trim(); };
}
function canonicalize(list){
  const grape = buildVocab(list.flatMap(w=>['drue1','drue2'].flatMap(c=>[w.cats[c].t, w.cats[c].g])));
  const voc = {}; ['region','appellation','type'].forEach(c=>{ voc[c] = buildVocab(list.flatMap(w=>[w.cats[c].t, w.cats[c].g])); });
  list.forEach(w=>{
    ['t','g'].forEach(k=>{
      w.cats.land[k] = canonCountry(w.cats.land[k]);
      w.cats.drue1[k] = grape(w.cats.drue1[k]); w.cats.drue2[k] = grape(w.cats.drue2[k]);
      ['region','appellation','type'].forEach(c=>{ w.cats[c][k] = voc[c](w.cats[c][k]); });
    });
  });
  return list;
}

/* ============================================================ filters */
function evenings(list){ return [...new Set(list.map(w=>w.date))].sort(); }
function baseFiltered(){
  // alle filtre undtagen spiller
  let L = ALL;
  const ev = evenings(ALL);
  if(F.period === 'last3'){ const keep = new Set(ev.slice(-3)); L = L.filter(w=>keep.has(w.date)); }
  else if(/^y\d{4}$/.test(F.period)){ const y = F.period.slice(1); L = L.filter(w=>w.date.startsWith(y)); }
  else if(/^d/.test(F.period)){ const d = F.period.slice(1); L = L.filter(w=>w.date===d); }
  if(F.land !== 'all') L = L.filter(w=>norm(w.cats.land.t)===F.land);
  if(F.drue !== 'all') L = L.filter(w=>norm(w.cats.drue1.t)===F.drue);
  return L;
}
function filtered(){ const L = baseFiltered(); return F.player==='all' ? L : L.filter(w=>w.guesser===F.player); }
function scopePlayers(){ return F.player==='all' ? PLAYERS : [F.player]; }
function isFiltered(){ return F.player!=='all' || F.period!=='all' || F.land!=='all' || F.drue!=='all'; }

/* ============================================================ stats helpers */
function byPlayer(L){ const o = {}; PLAYERS.forEach(p=>o[p]=L.filter(w=>w.guesser===p)); return o; }
function evWinners(L){
  // pr. aften: hvem havde det højeste gennemsnit som gætter
  return evenings(L).map(d=>{
    const ws = L.filter(w=>w.date===d);
    const per = PLAYERS.map(p=>{ const s = ws.filter(w=>w.guesser===p).map(w=>w.score); return {p, n:s.length, avg: s.length?avg(s):null, sum:s.reduce((a,b)=>a+b,0)}; });
    const played = per.filter(x=>x.n>0);
    let winner = null;
    if(played.length >= 2){
      const best = Math.max(...played.map(x=>x.avg));
      const top = played.filter(x=>x.avg===best);
      winner = top.length===1 ? top[0].p : 'uafgjort';
    }
    return { date:d, wines:ws, per, winner };
  });
}
function winsSummary(B){
  const evs = evWinners(B), wins = {};
  PLAYERS.forEach(p=>wins[p]=0);
  evs.forEach(e=>{ if(e.winner && wins[e.winner] !== undefined) wins[e.winner]++; });
  return { wins, total: evs.length, ties: evs.filter(e=>e.winner==='uafgjort').length, solo: evs.filter(e=>!e.winner).length };
}
function hitCount(L, cid){ const a = L.filter(w=>w.cats[cid].applicable); return a.length ? `${a.filter(w=>w.cats[cid].pts>0).length}/${a.length}` : '–'; }
function hitRate(L, cid){
  const a = L.filter(w=>w.cats[cid].applicable);
  return a.length ? a.filter(w=>w.cats[cid].pts>0).length / a.length : null;
}
function ptsShare(L, cid){
  const a = L.filter(w=>w.cats[cid].applicable);
  const c = CATS.find(x=>x.id===cid);
  return a.length ? a.reduce((s,w)=>s+w.cats[cid].pts,0) / (a.length*c.max) : null;
}
function yearOf(s){ const m = /^(\d{4})$/.exec(String(s).trim()); return m ? +m[1] : null; }
function competitionRank(sorted, key){
  let rank = 0, prev = null;
  return sorted.map((x,i)=>{ const v = key(x); if(v !== prev){ rank = i+1; prev = v; } return { rank, item:x }; });
}

/* ============================================================ tooltip */
const tip = document.getElementById('tip');
function showTip(e, html){
  tip.innerHTML = html; tip.classList.add('show');
  const pt = e.touches ? e.touches[0] : e;
  let x = pt.clientX + 14, y = pt.clientY + 14;
  const r = tip.getBoundingClientRect();
  if(x + r.width > innerWidth - 8) x = pt.clientX - r.width - 14;
  if(y + r.height > innerHeight - 8) y = pt.clientY - r.height - 14;
  tip.style.left = Math.max(8,x)+'px'; tip.style.top = Math.max(8,y)+'px';
}
function hideTip(){ tip.classList.remove('show'); }
function tipRow(color, val, label){ return `<div class="tr"><span class="k" style="background:${color}"></span><b>${esc(val)}</b> ${esc(label)}</div>`; }
document.addEventListener('scroll', hideTip, {passive:true});

// delegeret hover: elementer med data-tip
document.addEventListener('pointermove', e=>{
  const el = e.target.closest && e.target.closest('[data-tip]');
  if(el && !el.closest('.chart-x')) showTip(e, el.getAttribute('data-tip'));
  else if(!e.target.closest || !e.target.closest('.chart-x')) hideTip();
});
document.addEventListener('focusin', e=>{
  const el = e.target.closest && e.target.closest('[data-tip]');
  if(el){ const r = el.getBoundingClientRect(); showTip({clientX:r.left+r.width/2, clientY:r.top}, el.getAttribute('data-tip')); }
});
document.addEventListener('focusout', hideTip);
// Mobil: et tryk på en graf viser tallene (der findes ingen "hover" på en telefon).
document.addEventListener('pointerdown', e=>{
  if(e.pointerType === 'mouse') return;
  const el = e.target.closest && e.target.closest('[data-tip]');

function uniqSorted(arr){
  const m = new Map(); arr.filter(Boolean).forEach(x=>{ const k = norm(x); if(!m.has(k)) m.set(k, x); });

}
function resetFilters(){ F = { player:'all', period:'all', land:'all', drue:'all' }; render(); }
function setFilter(k, v){ F[k] = v; render(); }

/* ============================================================ 1. oversigt */
function countRows(L, get){
  const m = new Map();
  L.forEach(w=>{ const v = get(w); if(!v) return; m.set(v, (m.get(v)||0)+1); });
  return [...m.entries()].sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0],'da'));
}
function distCard(title, rows, total, fKey, cap=10){
  if(!rows.length) return `<div class="card"><div class="card-title">${title}</div><div class="empty">Ingen data.</div></div>`;
  const shown = rows.slice(0, cap), rest = rows.slice(cap);
  const mx = Math.max(1, ...rows.map(x=>x[1]));
  const restN = rest.reduce((a,x)=>a+x[1],0);
  return `<div class="card"><div class="card-title">${title} <span class="sec-sub" style="font-family:var(--fb);text-transform:none;letter-spacing:0;color:var(--text-faint);text-shadow:none">klik for at filtrere</span></div>
    ${shown.map(([l,n])=>`<div class="hbar-row clickable ${F[fKey]===norm(l)?'sel':''}" tabindex="0" data-${fKey}="${esc(norm(l))}" data-tip="${esc(`<div class='tt'>${esc(l)}</div>`+tipRow('#8E6628', n+' vine', `· ${pct(n/total)} af alle`))}">
      <span class="nm">${esc(l)}</span><span class="tr"><i style="width:${n/mx*100}%;background:linear-gradient(90deg,var(--accent),#CA9954)"></i></span><span class="v">${n}</span></div>`).join('')}
    ${rest.length?`<div class="hbar-row" data-tip="${esc(rest.map(([l,n])=>`${esc(l)}: ${n}`).join('<br>'))}"><span class="nm" style="color:var(--text-faint)">Øvrige (${rest.length})</span><span class="tr"><i style="width:${Math.min(100,restN/mx*100)}%;background:var(--border-strong)"></i></span><span class="v">${restN}</span></div>`:''}
  </div>`;
}
function secOverview(L, B){
  const bp = byPlayer(L);
  const sp = scopePlayers();
  const lands = countRows(L, w=>w.cats.land.t);
  const druer = countRows(L, w=>w.cats.drue1.t);
  const single = sp.length === 1;
  let kpiHTML;
  if(single){
    const p = sp[0], ws = bp[p];
    const tot = ws.reduce((a,w)=>a+w.score,0), poss = ws.reduce((a,w)=>a+(w.possible||MAX),0);
    const others = PLAYERS.filter(x=>x!==p).map(o=>{ const ow = B.filter(w=>w.guesser===o); return ow.length ? `${esc(o)}: ${fmt1(avg(ow.map(w=>w.score)))}` : ''; }).filter(Boolean);
    const W = winsSummary(B);
    const best = ws.slice().sort((x,y)=>y.score-x.score || y.date.localeCompare(x.date))[0];
    const k = [
      {l:'Vine gættet', n:ws.length, s:`${evenings(ws).length} aftener`},
      {l:'Point i alt', n:tot, s:`af ${poss} mulige`},
      {l:'Gns. pr. vin', n:ws.length?fmt1(avg(ws.map(w=>w.score))):'–', s: others.length ? others.join(' · ') : `af ${MAX} point`},
      {l:'Vundne aftener', n:W.wins[p]||0, s:`af ${W.total} aftener`},
      {l:'Bedste vin', n: best ? `${best.score}<span style="font-size:0.45em;color:var(--text-faint)">/24</span>` : '–', s: best ? `<span class="linkish" data-wine="${esc(best.id)}" title="${esc(best.name)}">${esc(best.name)}</span>` : ''},
    ];
    kpiHTML = `<div class="grid g-kpi5">${k.map(x=>`<div class="card kpi"><div class="l">${x.l}</div><div class="n">${x.n}</div><div class="s">${x.s}</div></div>`).join('')}</div>`;
  } else {
    const k = [
      {l:'Blindede vine', n:L.length, s:`${evenings(L).length} aftener`},
      ...sp.map(p=>({l:`${esc(p)} har gættet`, n:bp[p].length, s:'vine', c:colorOf(p)})),
      {l:'Gns. alle gæt', n:fmt1(avg(L.map(w=>w.score))), s:`af ${MAX} point`},
      ...sp.map(p=>({l:`Gns. ${esc(p)}`, n:bp[p].length?fmt1(avg(bp[p].map(w=>w.score))):'–', s:`af ${MAX} point`, c:colorOf(p)})),
    ];
    kpiHTML = `<div class="grid g-kpi">${k.map(x=>`<div class="card kpi"><div class="l">${x.c?`<span class="dot" style="background:${x.c}"></span>`:''}${x.l}</div><div class="n">${x.n}</div><div class="s">${x.s}</div></div>`).join('')}</div>`;
  }
  return `<section class="section fade-in"><div class="sec-head"><span class="sec-num">${num()}</span><h2>Oversigt</h2>${single?`<span class="sec-sub">${pnameHTML(sp[0])} som gætter</span>`:''}</div>
    ${kpiHTML}
    <div class="grid g3" style="margin-top:14px">
      ${distCard('Fordeling på lande', lands, L.length, 'land')}
      ${distCard(single ? `Druer ${esc(sp[0])} er blindet i` : 'Oftest blindede druer', druer, L.length, 'drue')}
      <div class="card"><div class="card-title">${single ? 'Score-fordeling' : 'Hvem har gættet hvor meget'}</div>${single ? scoreDist(L, sp) : whoGuessedChart(L)}</div>
    </div>
  </section>`;
}
function scoreDist(L, sp){
  const buckets = [[0,5],[6,10],[11,15],[16,20],[21,24]];
  const rows = buckets.map(([a,b])=>({lbl:`${a}–${b} p`, per: sp.map(p=>({p, n:L.filter(w=>w.guesser===p && w.score>=a && w.score<=b).length}))}));
  const mx = Math.max(1, ...rows.flatMap(r=>r.per.map(x=>x.n)));
  return rows.map(r=>`<div class="hbar-row"><span class="nm" style="color:var(--text-dim)">${r.lbl}</span><span class="tr pairbars">${r.per.map(x=>`<i class="hit" style="width:${x.n/mx*100}%;background:${colorOf(x.p)};border-radius:0 3px 3px 0" data-tip="${esc(`<div class='tt'>${r.lbl}</div>`+tipRow(colorOf(x.p), x.n+' vine', x.p))}"></i>`).join('')}</span><span class="v">${r.per.map(x=>x.n).join(' / ')}</span></div>`).join('');
}
function whoGuessedChart(L){
  const sp = scopePlayers();
  const total = L.length;
  let x = 0;
  const seg = sp.map(p=>{ const n = L.filter(w=>w.guesser===p).length; const w = total? n/total*100 : 0; const s = `<i class="hit" style="position:absolute;top:0;bottom:0;border-radius:3px;left:${x}%;width:calc(${w}% - 2px);background:${colorOf(p)}" data-tip="${esc(tipRow(colorOf(p), n+' vine', 'gættet af '+p))}"></i>`; x += w; return s; }).join('');
  return `<div style="position:relative;height:22px;margin-bottom:6px">${seg}</div>
    <div class="legend" style="margin-bottom:16px">${sp.map(p=>`<span><span class="kb" style="background:${colorOf(p)}"></span>${esc(p)} · ${L.filter(w=>w.guesser===p).length}</span>`).join('')}</div>
    <div class="card-title" style="margin-bottom:6px;color:var(--text-dim);text-shadow:none">Score-fordeling</div>
    ${scoreDist(L, sp)}`;
}

/* ============================================================ 2. stillingen */
function secStanding(L, B){
  const sp = scopePlayers();
  if(sp.length < 2) return '';   // i enkeltpersonvisning står tallene i oversigten
  const bp = byPlayer(L);
  const W = winsSummary(B);
  const S = sp.map(p=>{
    const ws = bp[p];
    const tot = ws.reduce((s,w)=>s+w.score,0);
    const a = ws.length ? avg(ws.map(w=>w.score)) : 0;
    const best = ws.slice().sort((x,y)=>y.score-x.score || y.date.localeCompare(x.date))[0];
    return { p, tot, a, wins: W.wins[p]||0, best, n: ws.length };
  });
  const lead = (key)=>{ const m = Math.max(...S.map(s=>s[key])); const t = S.filter(s=>s[key]===m); return t.length===1 ? t[0].p : null; };
  const L1 = lead('tot'), L2 = lead('a'), L4 = lead('wins');
  const col = (s, key, big, small)=>`<div class="c ${key===s.p?'lead':''}"><span class="big">${big}</span>${small?`<span class="small">${small}</span>`:''}</div>`;
  const notes = [];
  if(W.ties) notes.push(`${W.ties} ${W.ties===1?'aften':'aftener'} endte uafgjort`);
  if(W.solo) notes.push(`${W.solo} ${W.solo===1?'aften':'aftener'} gættede kun den ene af jer`);
  const rule = esc(`<div class='tt'>Vundne aftener</div>Aftenens vinder er den, der fik flest point pr. vin i snit som gætter.`);
  return `<section class="section"><div class="sec-head"><span class="sec-num">${num()}</span><h2>Stillingen</h2><span class="sec-sub">Den, der fører, står med grønt</span></div>
    <div class="card"><div class="stand" style="--np:${S.length}">
      <div class="h"></div>${S.map(s=>`<div class="h" style="color:${colorOf(s.p)}">${esc(s.p)}</div>`).join('')}
      <div class="c lbl">Samlede point</div>${S.map(s=>col(s,L1,s.tot,`${s.n} vine`)).join('')}
      <div class="c lbl">Gns. pr. vin</div>${S.map(s=>col(s,L2,fmt1(s.a),'')).join('')}
      <div class="c lbl" data-tip="${rule}" tabindex="0">Vundne aftener <span style="color:var(--text-faint);font-weight:400">ⓘ</span></div>${S.map(s=>col(s,L4,s.wins,`af ${W.total} aftener`)).join('')}
      <div class="c lbl">Bedste vin</div>${S.map(s=>s.best?`<div class="c"><span class="big">${s.best.score}<span style="font-size:0.55em;color:var(--text-faint)">/24</span></span><span class="small linkish" data-wine="${esc(s.best.id)}" title="${esc(s.best.name)}">${esc(s.best.name)}</span></div>`:`<div class="c">–</div>`).join('')}
    </div>
    ${notes.length?`<div class="stand-note">${notes.join(' · ')}</div>`:''}</div>
  </section>`;
}

/* ============================================================ 3. udvikling */
function secTrend(L){
  const ev = evenings(L);
  const sp = scopePlayers();
  const series = sp.map(p=>{
    let cum = 0, cn = 0;
    const pts = ev.map(d=>{
      const s = L.filter(w=>w.date===d && w.guesser===p).map(w=>w.score);
      s.forEach(x=>{ cum += x; cn++; });
      const v = UI.trend==='evening' ? (s.length?avg(s):null) : (cn?cum/cn:null);
      return { d, v, n:s.length };
    });
    return { p, pts };
  });
  return `<section class="section"><div class="sec-head"><span class="sec-num">${num()}</span><h2>Udvikling over tid</h2></div>
    <div class="card"><div class="card-title"><span>${UI.trend==='evening'?'Gennemsnit pr. aften':'Løbende gennemsnit'}</span>
      <div class="mini-seg"><button data-ui="trend" data-v="evening" class="${UI.trend==='evening'?'on':''}">Pr. aften</button><button data-ui="trend" data-v="running" class="${UI.trend==='running'?'on':''}">Løbende gns.</button></div></div>
      ${ev.length < 2 ? `<div class="empty">Der skal være mindst to aftener for at vise en udvikling.</div>` : lineChart(ev, series)}
      <div class="legend" style="margin-top:8px">${sp.map(p=>`<span><span class="k" style="background:${colorOf(p)}"></span>${esc(p)}</span>`).join('')}</div>
      <div class="card-note">${UI.trend==='evening'?'Hvert punkt er jeres gennemsnit som gætter den aften.':'Gennemsnittet af alle vine til og med den aften – stiger linjen, bliver man bedre.'}</div>
    </div></section>`;
}
function lineChart(xs, series){
  const W = narrow() ? 440 : 900, H = narrow() ? 260 : 300, m = {l:36, r:70, t:14, b:34};
  const iw = W-m.l-m.r, ih = H-m.t-m.b;
  const X = i => m.l + (xs.length===1 ? iw/2 : i*iw/(xs.length-1));
  const Y = v => m.t + ih - v/MAX*ih;
  const ticks = [0,6,12,18,24];
  let g = ticks.map(t=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)" stroke-width="1"/><text class="lbl-t" x="${m.l-8}" y="${Y(t)+5}" text-anchor="end">${t}</text>`).join('');
  const step = Math.max(1, Math.ceil(xs.length/8));
  g += xs.map((d,i)=> (i%step===0 || i===xs.length-1) ? `<text class="lbl-t" x="${X(i)}" y="${H-10}" text-anchor="middle">${fmtDate(d,false)}</text>` : '').join('');
  const lines = series.map(s=>{
    const c = colorOf(s.p);
    let path = '', pen = false;
    s.pts.forEach((pt,i)=>{ if(pt.v==null){ pen=false; return; } path += (pen?'L':'M') + X(i).toFixed(1)+','+Y(pt.v).toFixed(1); pen = true; });
    const dots = s.pts.map((pt,i)=> pt.v==null ? '' : `<circle cx="${X(i)}" cy="${Y(pt.v)}" r="4.5" fill="${c}" stroke="#F8F4EE" stroke-width="2"/>`).join('');
    const lastI = s.pts.map(p=>p.v!=null).lastIndexOf(true);
    const lbl = lastI>=0 ? `<text class="val-t end-lbl" data-y="${Y(s.pts[lastI].v)+5}" x="${X(lastI)+10}" y="${Y(s.pts[lastI].v)+5}" style="fill:${c}">${narrow()?'':esc(s.p)+' '}${fmt1(s.pts[lastI].v)}</text>` : '';
    return `<path d="${path}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 4px ${c}88)"/>${dots}${lbl}`;
  }).join('');
  const data = encodeURIComponent(JSON.stringify({xs, series: series.map(s=>({p:s.p, c:colorOf(s.p), v:s.pts.map(x=>x.v), n:s.pts.map(x=>x.n)})), m, W, H, mode:UI.trend}));
  return `<div class="chart chart-x" data-line="${data}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Udvikling over tid">${g}<line class="xhair" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--text-faint)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>${lines}<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" class="hitbox"/></svg></div>`;
}
function bindLineCharts(){
  document.querySelectorAll('[data-line]').forEach(el=>{
    const D = JSON.parse(decodeURIComponent(el.getAttribute('data-line')));
    const svg = el.querySelector('svg'), xh = el.querySelector('.xhair');
    // skub slut-etiketter fra hinanden, hvis de overlapper
    const labs = [...el.querySelectorAll('.end-lbl')].sort((a,b)=>+a.dataset.y - +b.dataset.y);
    for(let i=1;i<labs.length;i++){ const py = +labs[i-1].getAttribute('y'), y = +labs[i].getAttribute('y'); if(y - py < 17) labs[i].setAttribute('y', py + 17); }
    const iw = D.W - D.m.l - D.m.r;
    const move = e=>{
      const pt = e.touches ? e.touches[0] : e;
      const r = svg.getBoundingClientRect();
      const sx = (pt.clientX - r.left) / r.width * D.W;
      let i = D.xs.length===1 ? 0 : Math.round((sx - D.m.l) / (iw/(D.xs.length-1)));
      i = Math.max(0, Math.min(D.xs.length-1, i));
      const x = D.m.l + (D.xs.length===1 ? iw/2 : i*iw/(D.xs.length-1));
      xh.setAttribute('x1',x); xh.setAttribute('x2',x); xh.style.display='';
      const rows = D.series.map(s=> tipRow(s.c, s.v[i]==null?'–':fmt1(s.v[i]), s.p + (D.mode==='evening' && s.n[i] ? ` · ${s.n[i]} vine` : ''))).join('');
      showTip(pt, `<div class="tt">${fmtDate(D.xs[i])}</div>${rows}`);
    };
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerdown', move);
    svg.addEventListener('pointerleave', ()=>{ xh.style.display='none'; hideTip(); });
  });
}

function secCategories(L){

  const bp = byPlayer(L);
  const head = `<section class="section"><div class="sec-head"><span class="sec-num">${num()}</span><h2>Styrker og svagheder</h2></div>`;
  const note = `Pointfrekvens: antal vine med point i kategorien ud af antal forsøg (årgang ±1 år tæller med). Kategorier uden facit, fx ingen appellation, tæller ikke med.`;
  if(sp.length === 1){
    const p = sp[0], ws = bp[p], B = baseFiltered();
    const others = PLAYERS.filter(x=>x!==p);
    const rows = CATS.map(c=>{ const a = ws.filter(w=>w.cats[c.id].applicable); const h = a.filter(w=>w.cats[c.id].pts>0).length;
      return { c, n:a.length, h, v: a.length ? h/a.length : null, o: others.map(o=>({o, v: hitRate(B.filter(w=>w.guesser===o), c.id)})).filter(x=>x.v!=null) }; })
      .filter(r=>r.v!=null).sort((a,b)=>b.v-a.v);
    return head + `<div class="card"><div class="card-title">Pointfrekvens pr. kategori <span class="sec-sub" style="font-family:var(--fb);text-transform:none;letter-spacing:0;color:var(--text-faint)">stærkest øverst</span></div>
      ${rows.map(r=>`<div class="hbar-row" style="grid-template-columns:minmax(110px,170px) 1fr minmax(84px,auto)" data-tip="${esc(`<div class='tt'>${r.c.label} · ${r.c.max} p</div>`+tipRow(colorOf(p), pct(r.v), `${p} · ${r.h} af ${r.n} vine`)+r.o.map(x=>tipRow(colorOf(x.o), pct(x.v), x.o)).join(''))}">
        <span class="nm">${r.c.label} <span style="color:var(--text-faint)">${r.c.max}p</span></span>
        <span class="tr"><i style="width:${r.v*100}%;${r.v===0?'min-width:2px;':''}background:${colorOf(p)}"></i>${r.o.map(x=>`<b class="tick" style="left:calc(${x.v*100}% - 1px)"></b>`).join('')}</span>
        <span class="v"><b style="font-weight:700;color:var(--text)">${r.h}/${r.n}</b></span></div>`).join('')}
      <div class="legend" style="margin-top:10px"><span><span class="kb" style="background:${colorOf(p)}"></span>${esc(p)}</span>${others.length?`<span><span class="kb" style="background:#1E2D32;width:3px"></span>${others.map(esc).join(', ')} til sammenligning</span>`:''}</div>
      <div class="card-note">${note}</div></div></section>`;
  }
  const top = CATS.map(c=>({c, v:hitRate(L,c.id), n:L.filter(w=>w.cats[c.id].applicable).length})).filter(x=>x.v!=null).sort((a,b)=>b.v-a.v).slice(0,5);
  return head + `<div class="grid g2">
      <div class="card"><div class="card-title">Radar pr. kategori</div>
        ${radar(sp.map(p=>({p, v:CATS.map(c=>hitRate(bp[p], c.id))})))}
        <div class="legend" style="justify-content:center">${sp.map(p=>`<span><span class="k" style="background:${colorOf(p)}"></span>${esc(p)}</span>`).join('')}</div>
        <div class="card-note">Jo længere ude, jo oftere scorer man point i kategorien. Tryk på et punkt for tallene.</div>
      </div>
      <div class="card"><div class="card-title">Pointfrekvens pr. kategori</div>
        ${CATS.map(c=>`<div class="hbar-row"><span class="nm">${c.label} <span style="color:var(--text-faint)">${c.max}p</span></span><span class="tr pairbars">${sp.map(p=>{ const v = hitRate(bp[p], c.id); return `<i class="hit" style="width:${(v||0)*100}%;background:${colorOf(p)};border-radius:0 3px 3px 0" data-tip="${esc(`<div class='tt'>${c.label}</div>`+tipRow(colorOf(p), v==null?'–':pct(v), p))}"></i>`; }).join('')}</span><span class="v">${sp.map(p=>`<span style="color:${colorOf(p)};font-weight:700">${hitCount(bp[p],c.id)}</span>`).join(' <span style="color:var(--text-faint)">·</span> ')}</span></div>`).join('')}
        <div class="card-note">${note}</div>
      </div>
    </div>
    <div class="card" style="margin-top:14px"><div class="card-title">Top 5 · hvor vi oftest scorer</div>
      ${top.map((x,i)=>`<div class="hbar-row" style="grid-template-columns:28px minmax(90px,140px) 1fr 54px"><span style="font-family:var(--fnum);font-weight:800;color:var(--accent)">${i+1}.</span><span class="nm">${x.c.label}</span><span class="tr"><i class="hit" style="width:${x.v*100}%;background:linear-gradient(90deg,var(--accent-2),#7FF8FF)" data-tip="${esc(`<div class='tt'>${x.c.label}</div>`+tipRow('#4F6563', pct(x.v), `af ${x.n} vine med facit`))}"></i></span><span class="v">${pct(x.v)}</span></div>`).join('')}
      <div class="card-note">Begge gættere samlet. Andel af vinene, hvor kategorien gav point.</div>
    </div></section>`;
}
function radar(series){
  const S = 340, cx = S/2, cy = S/2 + 4, R = 112, n = CATS.length;
  const ang = i => -Math.PI/2 + i*2*Math.PI/n;
  const P = (i, r) => [cx + Math.cos(ang(i))*r, cy + Math.sin(ang(i))*r];
  let g = [0.25,0.5,0.75,1].map(t=>`<polygon points="${CATS.map((c,i)=>P(i,R*t).join(',')).join(' ')}" fill="none" stroke="var(--grid)" stroke-width="1"/>`).join('');
  g += CATS.map((c,i)=>{ const [x,y] = P(i,R); const [lx,ly] = P(i,R+24); const anchor = Math.abs(lx-cx)<8?'middle':(lx>cx?'start':'end');
    const upper = ly < cy - 10;
    const vals = series.map((s,k)=>`<tspan style="fill:${colorOf(s.p)};font-weight:700">${s.v[i]==null?'–':pct(s.v[i])}</tspan>${k<series.length-1?'<tspan style="fill:var(--text-faint)"> · </tspan>':''}`).join('');
    const nameY = upper ? ly - 4 : ly + 4, valY = upper ? nameY + 17 : nameY + 17;
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--grid)"/>`
      + `<text class="lbl-t" x="${lx}" y="${upper ? nameY - 17 : nameY}" text-anchor="${anchor}" style="font-size:15px;fill:var(--text)">${c.short}</text>`
      + `<text class="lbl-t" x="${lx}" y="${upper ? nameY : valY}" text-anchor="${anchor}" style="font-size:14px">${vals}</text>`; }).join('');
  const polys = series.map(s=>{ const c = colorOf(s.p);
    const pts = s.v.map((v,i)=>P(i, R*(v||0)));
    return `<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${c}" fill-opacity="0.16" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>`
      + pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${c}" stroke="#F8F4EE" stroke-width="2"/><circle class="hit" cx="${p[0]}" cy="${p[1]}" r="14" fill="transparent" data-tip="${esc(`<div class='tt'>${CATS[i].label}</div>`+series.map(z=>tipRow(colorOf(z.p), z.v[i]==null?'–':pct(z.v[i]), z.p)).join(''))}"/>`).join('');
  }).join('');
  return `<div class="chart" style="max-width:440px;margin:0 auto"><svg viewBox="-70 -34 ${S+140} ${S+74}" role="img" aria-label="Radar over kategorier">${g}${polys}</svg></div>`;
}

/* ============================================================ 6. geografi & druer */
function secGeo(L){
  const sp = scopePlayers();
  const both = sp.length > 1;
  const key = UI.geo==='land' ? 'land' : 'drue1';
  const fKey = key==='land' ? 'land' : 'drue';
  const word = key==='land' ? 'landet' : 'druen';
  // venstre: set fra facit – hvor ofte blev det ramt
  const byTruth = new Map(), byGuess = new Map();
  L.forEach(w=>{ const c = w.cats[key]; if(!c.applicable) return;
    const k = norm(c.t); if(!byTruth.has(k)) byTruth.set(k,{name:c.t, ws:[]}); byTruth.get(k).ws.push(w);
    if(c.g){ const g = norm(c.g); if(!byGuess.has(g)) byGuess.set(g,{name:c.g, ws:[]}); byGuess.get(g).ws.push(w); } });
  const ok = w => w.cats[key].pts > 0;
  const truthRows = [...byTruth.values()].map(g=>({ ...g, n:g.ws.length, x:g.ws.filter(ok).length,
      per: sp.map(p=>{ const ws = g.ws.filter(w=>w.guesser===p); return {p, n:ws.length, x:ws.filter(ok).length}; }) }))
    .sort((a,b)=> b.n-a.n || b.x-a.x || a.name.localeCompare(b.name,'da'));
  // højre: set fra gættet – hvor ofte var gættet forkert
  const guessRows = [...byGuess.values()].map(g=>({ ...g, n:g.ws.length, x:g.ws.filter(w=>!ok(w)).length,
      per: sp.map(p=>{ const ws = g.ws.filter(w=>w.guesser===p); return {p, n:ws.length, x:ws.filter(w=>!ok(w)).length}; }) }))
    .sort((a,b)=> b.x-a.x || b.n-a.n || a.name.localeCompare(b.name,'da'));

  const tipFor = (r, what) => esc(`<div class='tt'>${esc(r.name)} · ${r.x}/${r.n} ${what}</div>` + r.per.map(x=> x.n ? tipRow(colorOf(x.p), `${x.x}/${x.n}`, x.p) : tipRow(colorOf(x.p), '–', `${x.p}: ingen`)).join(''));
  const rowHTML = (r, side) => {
    const isGuess = side === 'g';
    const barColor = isGuess ? '#A34A3A' : '#D3C0AF';
    const what = isGuess ? 'forkerte' : 'ramt';
    const frac = r.n ? r.x/r.n : 0;
    const bar = (f, col, dim) => `<span class="tr"><i style="width:${f*100}%;${f===0?'min-width:2px;':''}background:${col};${dim?'opacity:0.25;':''}${col===barColor?'box-shadow:inset 0 0 0 1.5px #1E2D32':''}"></i></span>`;
    if(!both){
      const attrs = isGuess ? '' : `class="hbar-row clickable ${F[fKey]===norm(r.name)?'sel':''}" tabindex="0" data-${fKey}="${esc(norm(r.name))}"`;
      return `<div ${attrs || 'class="hbar-row"'} data-tip="${tipFor(r, what)}"><span class="nm" title="${esc(r.name)}">${esc(r.name)}</span>${bar(frac, isGuess ? barColor : colorOf(sp[0]))}<span class="v"><b style="font-weight:700;color:var(--text)">${r.x}/${r.n}</b></span></div>`;
    }
    const id = side + ':' + fKey + ':' + norm(r.name);
    const open = UI.geoOpen === id;
    return `<div class="hbar-row clickable ${open?'open':''} ${!isGuess && F[fKey]===norm(r.name)?'sel':''}" tabindex="0" data-geo-open="${esc(id)}" data-tip="${tipFor(r, what)}">
        <span class="nm" title="${esc(r.name)}">${esc(r.name)}<span class="caret">▸</span></span>${bar(frac, barColor)}<span class="v"><b style="font-weight:700;color:var(--text)">${r.x}/${r.n}</b></span></div>
      ${open?`<div class="geo-detail">${r.per.map(x=>`<div class="hbar-row"><span class="nm">${pnameHTML(x.p)}</span>${bar(x.n?x.x/x.n:0, colorOf(x.p), !x.n)}<span class="v">${x.n?`${x.x}/${x.n}`:'–'}</span></div>`).join('')}
        ${isGuess?'':`<button class="show-only" data-${fKey}="${esc(norm(r.name))}">${F[fKey]===norm(r.name)?'Fjern filter':'Vis kun '+esc(r.name)}</button>`}</div>`:''}`;
  };
  const switcher = `<div class="mini-seg"><button data-ui="geo" data-v="land" class="${UI.geo==='land'?'on':''}">Lande</button><button data-ui="geo" data-v="drue" class="${UI.geo==='drue'?'on':''}">Druer</button></div>`;
  const tap = both ? ' Tryk på en række for at se fordelingen mellem jer.' : '';
  return `<section class="section"><div class="sec-head"><span class="sec-num">${num()}</span><h2>Geografi og druer</h2>${switcher}</div>
    <div class="grid g2">
      <div class="card"><div class="card-title"><span>Når det var facit</span><span class="sec-sub" style="font-family:var(--fb);text-transform:none;letter-spacing:0;color:var(--text-faint)">ramt / serveret</span></div>
        ${truthRows.length ? truthRows.map(r=>rowHTML(r,'t')).join('') : '<div class="empty">Ingen data.</div>'}
        <div class="card-note">Hvor mange gange ${word} blev gættet rigtigt ud af de gange, det var facit.${tap}${both?'':' Tryk for at filtrere.'}</div>
      </div>
      <div class="card"><div class="card-title"><span>${both?'Når I gættede det':'Når '+esc(sp[0])+' gættede det'}</span><span class="sec-sub" style="font-family:var(--fb);text-transform:none;letter-spacing:0;color:var(--text-faint)">forkerte / gættet</span></div>
        ${guessRows.length ? guessRows.map(r=>rowHTML(r,'g')).join('') : '<div class="empty">Ingen gæt endnu.</div>'}
        <div class="card-note">Hvor mange gange gættet var forkert ud af de gange, ${word} blev gættet. Flest fejlgæt øverst.${tap}</div>
      </div>
    </div></section>`;
}

/* ============================================================ 7. årgang */
/* ============================================================ 7. årgang */
function secVintage(L){
  const sp = scopePlayers();
  const per = sp.map(p=>{
    const d = L.filter(w=>w.guesser===p).map(w=>{ const t = yearOf(w.cats.aargang.t), g = yearOf(w.cats.aargang.g); return (t&&g) ? g - t : null; }).filter(x=>x!=null);
    const nv = L.filter(w=>w.guesser===p && norm(w.cats.aargang.t)==='nv');
    return { p, d, mae: d.length?avg(d.map(Math.abs)):null, bias: d.length?avg(d):null, exact: d.filter(x=>x===0).length, near: d.filter(x=>Math.abs(x)===1).length, nv: nv.length, nvHit: nv.filter(w=>w.cats.aargang.pts>0).length };
  });
  const range = [-4,-3,-2,-1,0,1,2,3,4];
  const bucket = (d,v)=> d.filter(x=> v===-4 ? x<=-4 : v===4 ? x>=4 : x===v).length;
  const mx = Math.max(1, ...per.flatMap(x=>range.map(v=>bucket(x.d,v))));
  const W = narrow() ? 440 : 900, H = narrow() ? 220 : 230, m = {l:30,r:10,t:18,b:40}, iw = W-m.l-m.r, ih = H-m.t-m.b, bw = iw/range.length, gap = 3;
  const inner = (bw - 16) / sp.length;
  let svg = [0, Math.ceil(mx/2), mx].map(t=>`<line x1="${m.l}" x2="${W-m.r}" y1="${m.t+ih-t/mx*ih}" y2="${m.t+ih-t/mx*ih}" stroke="var(--grid)"/><text class="lbl-t" x="${m.l-6}" y="${m.t+ih-t/mx*ih+5}" text-anchor="end">${t}</text>`).join('');
  range.forEach((v,i)=>{
    const x0 = m.l + i*bw + 8;
    svg += `<text class="lbl-t" x="${m.l+i*bw+bw/2}" y="${H-18}" text-anchor="middle" style="${v===0?'fill:var(--good)':''}">${v===0?(narrow()?'0':'præcis'):(v>0?'+':'')+(Math.abs(v)===4?(v>0?'4+':'−4+'):v)}</text>`;
    per.forEach((x,k)=>{ const n = bucket(x.d,v); const h = n/mx*ih; const c = colorOf(x.p);
      svg += `<rect x="${x0+k*inner+gap/2}" y="${m.t+ih-h}" width="${Math.max(2,inner-gap)}" height="${Math.max(0,h)}" rx="3" fill="${c}"/>`
        + `<rect class="hit" x="${x0+k*inner}" y="${m.t}" width="${inner}" height="${ih}" fill="transparent" data-tip="${esc(`<div class='tt'>${v===0?'Præcis årgang':(Math.abs(v)===4?`${v>0?'4 år eller mere for ungt':'4 år eller mere for gammelt'}`:`${Math.abs(v)} år for ${v>0?'ungt':'gammelt'}`)}</div>`+tipRow(c, n+' gæt', x.p))}"/>`; });
  });
  svg += `<text class="lbl-t" x="${m.l}" y="${H-2}">← for gammelt</text><text class="lbl-t" x="${W-m.r}" y="${H-2}" text-anchor="end">for ungt →</text>`;
  return `<section class="section"><div class="sec-head"><span class="sec-num">${num()}</span><h2>Årgang</h2></div>
    <div class="grid g3">${per.map(x=>`<div class="card kpi"><div class="l">${pnameHTML(x.p)}</div>
      <div class="n">${x.mae==null?'–':fmt1(x.mae)+' år'}</div><div class="s">gns. ved siden af · ${x.exact} præcise · ${x.near} ±1 år</div>
      <div class="s" style="margin-top:6px;color:var(--text-dim)">${x.bias==null?'':Math.abs(x.bias)<0.25?'Ingen tydelig tendens':(x.bias>0?`Gætter i snit ${fmt1(x.bias)} år for ungt`:`Gætter i snit ${fmt1(-x.bias)} år for gammelt`)}${x.nv?` · NV: ${x.nvHit}/${x.nv} rigtige`:''}</div></div>`).join('')}
      <div class="card kpi"><div class="l">Sådan læses det</div><div class="s" style="font-size:1rem;color:var(--text-dim);margin-top:8px;line-height:1.4">"For ungt" betyder, at man har gættet en nyere årgang end facit. NV-vine indgår ikke i afvigelsen.</div></div>
    </div>
    <div class="card" style="margin-top:14px"><div class="card-title">Afvigelse i år</div>
      <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Afvigelse i årgangsgæt">${svg}</svg></div>
      <div class="legend">${sp.map(p=>`<span><span class="kb" style="background:${colorOf(p)}"></span>${esc(p)}</span>`).join('')}</div>
    </div></section>`;
}

/* ============================================================ 8. sværeste vine */
function secHardest(L){
  const sp = scopePlayers();
  const sorted = L.slice().sort((a,b)=> a.score-b.score || b.date.localeCompare(a.date));
  const ranked = competitionRank(sorted, w=>w.score).filter(r=>r.rank<=10);
  const shown = ranked.slice(0,12), more = ranked.length - shown.length;
  return `<section class="section"><div class="sec-head"><span class="sec-num">${num()}</span><h2>De sværeste vine</h2><span class="sec-sub">${sp.length===1?`Der hvor ${esc(sp[0])} scorede færrest point`:'Laveste scorer'}</span></div>
    <div class="card"><ol class="top10">${shown.map(({rank,item:w})=>`<li tabindex="0" data-wine="${esc(w.id)}">
      <span class="rk">${rank}.</span>
      <div style="min-width:0"><div class="nm">${esc(w.name)}</div><div class="sub">medbragt af ${esc(w.owner)} · ${pnameHTML(w.guesser)} gættede · ${fmtDate(w.date)}</div></div>
      <span class="sc" style="color:var(--bad)">${w.score}<small>/24</small></span></li>`).join('')}</ol>
      ${more>0?`<div class="card-note">+ ${more} vine mere med samme score.</div>`:''}</div></section>`;
}

/* ============================================================ 10. rekorder */
function secRecords(L, B){
  const sp = scopePlayers();
  const zeros = L.filter(w=>w.score===0);
  const perfect = L.filter(w=>w.possible>0 && w.score>=w.possible);
  const best = L.slice().sort((a,b)=>b.score-a.score)[0];
  const evs = evWinners(B);
  let bestEv = null;
  evs.forEach(e=>e.per.forEach(x=>{ if(x.n && (!bestEv || x.avg > bestEv.avg)) bestEv = {date:e.date, p:x.p, avg:x.avg, n:x.n}; }));
  const streak = sp.map(p=>{ let cur=0, bestS=0; L.filter(w=>w.guesser===p).forEach(w=>{ if(w.cats.drue1.pts>0){cur++; bestS=Math.max(bestS,cur);} else cur=0; }); return {p, s:bestS}; });
  const nemesis = sp.map(p=>{
    const m = new Map();
    L.filter(w=>w.guesser===p && w.cats.drue1.applicable).forEach(w=>{ const k = norm(w.cats.drue1.t); if(!m.has(k)) m.set(k,{name:w.cats.drue1.t,miss:0,n:0}); const o = m.get(k); o.n++; if(w.cats.drue1.pts===0) o.miss++; });
    const top = [...m.values()].filter(x=>x.miss>0).sort((a,b)=>b.miss-a.miss || (b.miss/b.n)-(a.miss/a.n))[0];
    return {p, top};
  });
  const catKing = CATS.map(c=>({c, per: sp.map(p=>({p, v:hitRate(L.filter(w=>w.guesser===p), c.id)}))}));
  const sure = L.filter(w=>w.cats.drue1.pts>0 && w.cats.land.pts===0 && w.cats.land.applicable);
  const card = (title, big, body)=>`<div class="card rec"><div class="card-title" style="margin-bottom:6px">${title}</div><div class="big">${big}</div>${body}</div>`;
  const wl = (arr)=> arr.slice(0,4).map(w=>`<span class="t linkish" data-wine="${esc(w.id)}" style="font-size:1rem">${esc(w.name)}</span><span class="s">${esc(w.guesser)} · ${fmtDate(w.date)}</span>`).join('') + (arr.length>4?`<span class="s">+ ${arr.length-4} mere</span>`:'');
  return `<section class="section"><div class="sec-head"><span class="sec-num">${num()}</span><h2>Rekorder og sjove fakta</h2></div>
    <div class="grid g3">
      ${best?card('Højeste score', `${best.score}/24`, `<span class="t linkish" data-wine="${esc(best.id)}">${esc(best.name)}</span><span class="s">${esc(best.guesser)} · ${fmtDate(best.date)}</span>`):''}
      ${card('Fuldtræffere', perfect.length, perfect.length?wl(perfect):'<span class="s">Alle kategorier med facit ramt – det er ikke sket endnu.</span>')}
      ${card('Nuller', zeros.length, zeros.length?wl(zeros):'<span class="s">Ingen vine med 0 point.</span>')}
      ${bestEv?card('Bedste aften', fmt1(bestEv.avg)+' p', `<span class="t">${pnameHTML(bestEv.p)} den ${fmtDate(bestEv.date)}</span><span class="s">gennemsnit over ${bestEv.n} vine</span>`):''}
      ${card('Længste drue-stime', streak.map(s=>s.s).join(' / '), streak.map(s=>`<span class="t">${pnameHTML(s.p)}: ${s.s} vine i træk med rigtig drue</span>`).join(''))}
      ${card('Nemesis-drue', nemesis.filter(n=>n.top).length?'😈':'–', nemesis.map(n=>`<span class="t">${pnameHTML(n.p)}: ${n.top?`<span style="color:var(--bad)">${esc(n.top.name)}</span> <span class="s">– ramt forkert ${n.top.miss} af ${n.top.n} gange</span>`:'<span class="s">ingen endnu</span>'}</span>`).join(''))}
      ${card('Rigtig drue, forkert land', sure.length, sure.length?wl(sure):'<span class="s">Det er ikke sket.</span>')}
      ${card('Kategori-konger', '👑', catKing.filter(k=>k.per.some(x=>x.v!=null)).map(k=>{ const s = k.per.filter(x=>x.v!=null).sort((a,b)=>b.v-a.v); const tie = s.length>1 && s[0].v===s[1].v; return `<span class="t" style="font-size:1rem">${k.c.label}: ${tie||sp.length<2?`<span class="s">${sp.length<2?pct(s[0].v):'lige'}</span>`:`${pnameHTML(s[0].p)} <span class="s">${pct(s[0].v)}</span>`}</span>`; }).join(''))}
    </div></section>`;
}

/* ============================================================ 11. vinarkiv */
function secArchive(L){
  return `<section class="section"><div class="sec-head"><span class="sec-num">${num()}</span><h2>Vinarkiv</h2><span class="sec-sub">${L.length} vine</span></div>
    <div class="card"><div style="margin-bottom:12px"><input class="search" id="arch-q" type="search" placeholder="Søg på vin, land, drue, region…" value="${esc(UI.archiveQ)}" autocomplete="off"></div>
      <div id="arch-table">${archiveTable(L)}</div></div></section>`;
}
function archiveTable(L){
  const q = norm(UI.archiveQ);
  let rows = L.filter(w=> !q || [w.name, w.owner, w.guesser, ...CATS.map(c=>w.cats[c.id].t), ...CATS.map(c=>w.cats[c.id].g)].some(s=>norm(s).includes(q)));
  const {key, dir} = UI.archiveSort;
  const val = w => key==='date' ? w.date + String(w.seq).padStart(6,'0') : key==='score' ? w.score : key==='name' ? norm(w.name) : key==='land' ? norm(w.cats.land.t) : key==='drue' ? norm(w.cats.drue1.t) : key==='guesser' ? norm(w.guesser) : key==='owner' ? norm(w.owner) : key==='aargang' ? String(w.cats.aargang.t) : '';
  rows = rows.slice().sort((a,b)=>{ const x = val(a), y = val(b); return (x<y?-1:x>y?1:0)*dir; });
  const th = (k,l,cls='')=>`<th class="sortable ${cls} ${key===k?'sorted':''}" data-sort="${k}">${l}${key===k?(dir>0?' ▲':' ▼'):''}</th>`;
  if(!rows.length) return `<div class="empty">Ingen vine matcher “${esc(UI.archiveQ)}”.</div>`;
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${th('date','Dato')}${th('name','Vin')}${th('land','Land')}${th('drue','Drue')}${th('aargang','Årgang')}${th('owner','Medbragt')}${th('guesser','Gætter')}${th('score','Point','num')}</tr></thead>
    <tbody>${rows.map(w=>`<tr tabindex="0" data-wine="${esc(w.id)}"><td class="dim" style="white-space:nowrap">${fmtDate(w.date)}</td><td>${esc(w.name)}</td>
      <td>${catCell(w,'land')}</td><td>${catCell(w,'drue1')}</td><td>${catCell(w,'aargang')}</td><td class="dim">${esc(w.owner)}</td><td>${pnameHTML(w.guesser)}</td>
      <td class="num" style="font-family:var(--fnum);font-size:0.62rem;color:var(--accent-2)">${w.score}</td></tr>`).join('')}</tbody></table></div>
    <div class="card-note">Grøn = ramt, gul = delvist (årgang ±1), rød = forkert. Klik på en vin for facit og gæt.</div>`;
}
function catCell(w, cid){ const c = w.cats[cid]; if(!c.applicable) return '<span class="dim">–</span>'; return `<span class="pill ${c.j==='good'?'good':c.j==='mid'?'mid':'bad'}" title="Gæt: ${esc(c.g||'(tomt)')}">${esc(c.t)}</span>`; }

/* ============================================================ load
   Google Apps Script kan være 10-20 sekunder om at vågne, hvis det har hvilet.
   Derfor vises de senest hentede vine med det samme (gemt i browseren), mens
   de nyeste hentes i baggrunden. Siden opdateres, når de nye vine er hentet. */
const CACHE_KEY = 'bv_stats_cache_v1';
const reloadBtn = document.getElementById('btn-reload');
reloadBtn.addEventListener('click', ()=>load(true));
function readCache(){ try{ const c = JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); if(c && Array.isArray(c.list)) return c; }catch(e){} return null; }
function writeCache(list){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), list })); }catch(e){} }
function hhmm(d){ return new Date(d).toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'}); }
function applyList(list){
  ALL = canonicalize(normalize(JSON.parse(JSON.stringify(list))));
  const seen = [];
  ALL.forEach(w=>{ if(w.guesser && !seen.includes(w.guesser)) seen.push(w.guesser); });
  // Lars og Tore i fast rækkefølge, øvrige efter
  PLAYERS = seen.sort((a,b)=>{ const o = n=>{ const k = norm(n); return k==='lars'?0:k==='tore'?1:2; }; return o(a)-o(b) || a.localeCompare(b,'da'); });
  if(F.player!=='all' && !PLAYERS.includes(F.player)) F.player = 'all';
}
const syncPill = document.createElement('div');
syncPill.id = 'sync-pill';
syncPill.setAttribute('role','status');
document.body.appendChild(syncPill);
function setPill(text, kind){
  syncPill.textContent = text || '';
  syncPill.className = text ? ('show ' + (kind||'')) : '';
}
let pillTimer = null;
let lastJSON = null;
async function load(soft){
  reloadBtn.classList.add('spin');
  clearTimeout(pillTimer);
  if(!ALL.length){
    const c = readCache();
    if(c){ applyList(c.list); lastJSON = JSON.stringify(c.list); render(); document.getElementById('updated').textContent = 'Vine fra kl. ' + hhmm(c.at); }
    else renderLoading();
  }
  if(ALL.length) setPill('Henter de nyeste vine…', 'busy');
  try{
    const list = await fetchWines();
    const json = JSON.stringify(list);
    writeCache(list);
    if(json !== lastJSON || !ALL.length){ applyList(list); lastJSON = json; render(); }
    LOADED_AT = new Date();
    document.getElementById('updated').textContent = 'Opdateret ' + hhmm(LOADED_AT);
    setPill('Opdateret', 'ok'); pillTimer = setTimeout(()=>setPill(''), 1600);
  }catch(err){
    if(ALL.length){ setPill('Kunne ikke hente nye vine – viser de senest hentede', 'err'); pillTimer = setTimeout(()=>setPill(''), 5000); }
    else renderError(err && err.message ? (/Failed to fetch|NetworkError|Load failed/i.test(err.message) ? 'Ingen forbindelse til regnearket. Tjek internetforbindelsen.' : err.message) : 'Ukendt fejl');
  }finally{
    reloadBtn.classList.remove('spin');
  }
}
load();
</script>
</body>
</html>
